<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planos e cobranca - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .plan-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .plan-card.current { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .plan-card.recommended::before {
      content: 'Recomendado';
      position: absolute;
      top: -10px;
      left: 16px;
      background: var(--brand-hover);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .plan-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .plan-price { font-size: 28px; font-weight: 800; color: var(--text-1); margin-bottom: 4px; }
    .plan-price small { font-size: 13px; font-weight: 500; color: var(--text-2); }
    .plan-features { list-style: none; padding: 0; margin: 16px 0; }
    .plan-features li {
      padding: 6px 0;
      font-size: 14px;
      color: var(--text-2);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .plan-features li::before {
      content: '+';
      color: var(--brand);
      font-weight: 700;
      flex-shrink: 0;
    }
    .quota-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-3);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .quota-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand), var(--brand-hover));
      transition: width 0.3s;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: var(--brand-soft);
      color: var(--brand-strong);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <a href="/dashboard" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/><rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/></svg><span>Dashboard</span></a>
      <a href="/clientes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.3" cy="6" r="2.6"/><path d="M1.3 15c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><circle cx="13" cy="6.5" r="2"/><path d="M11.6 10.6c1.9.4 3.4 1.8 3.4 4.1"/></svg><span>Clientes</span></a>
      <a href="/personas" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Personas</span></a>
      <a href="/roteiros" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h5l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M10 2v4h4"/><path d="M6.5 10.3h5M6.5 12.8h5"/></svg><span>Roteiros</span></a>
      <a href="/carrosseis" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="10" height="10" rx="1.3"/><path d="M5.5 5V3.3A1.3 1.3 0 0 1 6.8 2h7.9A1.3 1.3 0 0 1 16 3.3v7.9a1.3 1.3 0 0 1-1.3 1.3H13"/></svg><span>Carrosseis</span></a>
      <a href="/calendario" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12.5" rx="1.5"/><path d="M2 7h14M6 2v3M12 2v3"/></svg><span>Calendario</span></a>
      <a href="/edicao" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.5 15.5 6.7 6.2 16H2v-4.2L11.3 2.5Z"/></svg><span>Edição</span></a>
      <a href="/materiais" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.3A1.3 1.3 0 0 1 3.3 4h3.6l1.6 2H14.7A1.3 1.3 0 0 1 16 7.3v6.4A1.3 1.3 0 0 1 14.7 15H3.3A1.3 1.3 0 0 1 2 13.7V5.3Z"/></svg><span>Materiais</span></a>
      <div style="flex:1"></div>
      <a href="/billing" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 7.5h14"/><path d="M5 11.5h3"/></svg><span>Planos e cobranca</span></a>
      <a href="/configuracoes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg><span>Configuracoes</span></a>
      <button class="nav-item" id="logout-btn" style="text-align:left;"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16H3.5A1.5 1.5 0 0 1 2 14.5v-11A1.5 1.5 0 0 1 3.5 2H7"/><path d="M12 12.5 16 9l-4-3.5"/><path d="M16 9H6.5"/></svg><span>Sair</span></button>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1>Planos e cobranca</h1>
      </div>

      <div class="card" style="margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
          <div>
            <p class="muted small">Plano atual</p>
            <p style="font-size:24px; font-weight:700; margin: 4px 0;" id="current-plan">-</p>
            <p class="muted small" id="current-price">-</p>
          </div>
          <div style="text-align:right; min-width: 220px;">
            <p class="muted small">Uso de IA neste ciclo</p>
            <p style="font-size:18px; font-weight:600;" id="quota-text">- / -</p>
            <div class="quota-bar"><div class="quota-bar-fill" id="quota-fill" style="width:0%"></div></div>
            <p class="muted small" style="margin-top:6px;" id="quota-reset">-</p>
          </div>
        </div>
      </div>

      <h2 style="font-size:18px; margin-bottom:16px;">Escolha seu plano</h2>
      <div class="plans-grid" id="plans-grid"></div>

      <p class="muted small">
        Pagamento processado pela Lastlink (Pix, boleto, cartao). Cancele quando quiser.
      </p>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    function planButton(plan, currentCode) {
      if (plan.code === currentCode) {
        return '<button class="btn btn-ghost btn-block" disabled>Plano atual</button>';
      }
      const checkoutUrl = `/api/billing/checkout/${plan.code}`;
      return `<a href="${checkoutUrl}" class="btn btn-block">Assinar ${plan.name}</a>`;
    }

    (async () => {
      const me = await window.requireSession();
      if (!me) return;

      const [billing, plansResp] = await Promise.all([
        window.api.get('/api/billing/me'),
        window.api.get('/api/billing/plans'),
      ]);

      const org = billing.organization;
      const hasActivePlan = org.plan_code && org.plan_code !== 'none';
      document.getElementById('current-plan').textContent = hasActivePlan
        ? (org.plan_name || org.plan_code)
        : 'Nenhum plano ativo';
      document.getElementById('current-price').textContent = hasActivePlan
        ? (plansResp.plans.find(p => p.code === org.plan_code)?.price_formatted || '-')
        : 'Escolha um plano abaixo para liberar o acesso';

      const usedPct = org.ia_quota_limit > 0
        ? Math.round((org.ia_quota_used / org.ia_quota_limit) * 100)
        : 0;
      document.getElementById('quota-text').textContent = `${org.ia_quota_used} / ${org.ia_quota_limit}`;
      document.getElementById('quota-fill').style.width = Math.min(100, usedPct) + '%';

      if (org.ia_quota_reset_at) {
        const reset = new Date(org.ia_quota_reset_at);
        document.getElementById('quota-reset').textContent =
          `Renova em ${reset.toLocaleDateString('pt-BR')}`;
      }

      const grid = document.getElementById('plans-grid');
      grid.innerHTML = plansResp.plans.map(p => `
        <div class="plan-card ${p.code === org.plan_code ? 'current' : ''} ${p.code === 'pro' ? 'recommended' : ''}">
          <div class="plan-name">${p.name}</div>
          <div class="plan-price">
            ${p.price_formatted}
            ${p.price_cents > 0 ? '<small>/mes</small>' : ''}
          </div>
          <ul class="plan-features">
            ${p.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
          <div style="margin-top: auto;">
            ${planButton(p, org.plan_code)}
          </div>
        </div>
      `).join('');

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await window.api.post('/api/auth/logout');
        window.location.href = '/';
      });
    })();
  </script>
</body>
</html>
