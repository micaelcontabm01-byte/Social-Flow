<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roteiros - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .filters select { width: auto; min-width: 160px; }
    .script-row { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; transition: transform 0.12s, box-shadow 0.12s; }
    .script-row:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .script-row .title { font-weight: 700; }
    .script-row .meta { color: var(--text-2); font-size: 13px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-right: 6px; }
    .tag-topo { background: rgba(45, 134, 89, 0.15); color: #2d8659; }
    .tag-meio { background: rgba(184, 123, 26, 0.15); color: #b87b1a; }
    .tag-fundo { background: rgba(196, 83, 78, 0.15); color: #c4534e; }
    .tag-format { background: var(--bg-3); color: var(--text-1); }
    .status-draft { background: var(--bg-3); color: var(--text-2); }
    .status-pending_approval { background: rgba(184, 123, 26, 0.15); color: #b87b1a; }
    .status-approved { background: rgba(45, 134, 89, 0.15); color: #2d8659; }
    .status-rejected { background: rgba(196, 83, 78, 0.15); color: #c4534e; }
    .status-published { background: var(--brand-soft); color: var(--brand-strong); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <a href="/dashboard" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/><rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/></svg><span>Dashboard</span></a>
      <a href="/clientes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.3" cy="6" r="2.6"/><path d="M1.3 15c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><circle cx="13" cy="6.5" r="2"/><path d="M11.6 10.6c1.9.4 3.4 1.8 3.4 4.1"/></svg><span>Clientes</span></a>
      <a href="/personas" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Personas</span></a>
      <a href="/roteiros" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h5l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M10 2v4h4"/><path d="M6.5 10.3h5M6.5 12.8h5"/></svg><span>Roteiros</span></a>
      <a href="/carrosseis" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="10" height="10" rx="1.3"/><path d="M5.5 5V3.3A1.3 1.3 0 0 1 6.8 2h7.9A1.3 1.3 0 0 1 16 3.3v7.9a1.3 1.3 0 0 1-1.3 1.3H13"/></svg><span>Carrosseis</span></a>
      <a href="/calendario" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12.5" rx="1.5"/><path d="M2 7h14M6 2v3M12 2v3"/></svg><span>Calendario</span></a>
      <a href="/edicao" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.5 15.5 6.7 6.2 16H2v-4.2L11.3 2.5Z"/></svg><span>Edição</span></a>
      <a href="/materiais" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.3A1.3 1.3 0 0 1 3.3 4h3.6l1.6 2H14.7A1.3 1.3 0 0 1 16 7.3v6.4A1.3 1.3 0 0 1 14.7 15H3.3A1.3 1.3 0 0 1 2 13.7V5.3Z"/></svg><span>Materiais</span></a>
      <div style="flex:1"></div>
      <a href="/billing" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 7.5h14"/><path d="M5 11.5h3"/></svg><span>Planos e cobranca</span></a>
      <a href="/configuracoes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg><span>Configuracoes</span></a>
      <button class="nav-item" id="logout-btn" style="text-align:left;"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16H3.5A1.5 1.5 0 0 1 2 14.5v-11A1.5 1.5 0 0 1 3.5 2H7"/><path d="M12 12.5 16 9l-4-3.5"/><path d="M16 9H6.5"/></svg><span>Sair</span></button>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1>Roteiros</h1>
        <a href="/clientes" class="btn">+ Novo roteiro</a>
      </div>

      <div class="filters">
        <select id="f-client"><option value="">Todos os clientes</option></select>
        <select id="f-funnel">
          <option value="">Todas etapas</option>
          <option value="topo">Topo de funil</option>
          <option value="meio">Meio de funil</option>
          <option value="fundo">Fundo de funil</option>
        </select>
        <select id="f-status">
          <option value="">Todos status</option>
          <option value="draft">Rascunho</option>
          <option value="pending_approval">Aguardando aprovacao</option>
          <option value="approved">Aprovado</option>
          <option value="rejected">Rejeitado</option>
          <option value="published">Publicado</option>
        </select>
      </div>

      <div id="list"></div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const FUNNEL_LABEL = { topo: 'TOPO', meio: 'MEIO', fundo: 'FUNDO' };
    const STATUS_LABEL = {
      draft: 'Rascunho',
      pending_approval: 'Aguardando',
      approved: 'Aprovado',
      rejected: 'Rejeitado',
      published: 'Publicado',
    };

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadClients() {
      const { clients } = await window.api.get('/api/clients');
      const sel = document.getElementById('f-client');
      sel.innerHTML = '<option value="">Todos os clientes</option>' +
        clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }

    async function loadScripts() {
      const params = new URLSearchParams();
      const c = document.getElementById('f-client').value;
      const f = document.getElementById('f-funnel').value;
      const s = document.getElementById('f-status').value;
      if (c) params.set('client_id', c);
      if (f) params.set('funnel_stage', f);
      if (s) params.set('status', s);
      const { scripts } = await window.api.get('/api/scripts?' + params);
      const list = document.getElementById('list');
      if (scripts.length === 0) {
        list.innerHTML = `<div class="card" style="text-align:center; padding: 60px 20px;">
          <p class="muted">Nenhum roteiro encontrado.</p>
          <a href="/clientes" class="btn" style="margin-top: 14px;">Ir para Clientes</a>
        </div>`;
        return;
      }
      list.innerHTML = scripts.map(sc => `
        <a href="/roteiro?id=${sc.id}" class="script-row">
          <div>
            <div class="title">${escapeHtml(sc.title)}</div>
            <div class="meta">
              <span class="tag tag-${sc.funnel_stage}">${FUNNEL_LABEL[sc.funnel_stage]}</span>
              <span class="tag tag-format">${sc.format}</span>
              <span class="tag status-${sc.status}">${STATUS_LABEL[sc.status]}</span>
              ${escapeHtml(sc.client_name)} ${sc.persona_name ? '&middot; ' + escapeHtml(sc.persona_name) : ''}
            </div>
          </div>
          <span style="color: var(--text-3);">&rarr;</span>
        </a>
      `).join('');
    }

    document.getElementById('f-client').addEventListener('change', loadScripts);
    document.getElementById('f-funnel').addEventListener('change', loadScripts);
    document.getElementById('f-status').addEventListener('change', loadScripts);

    (async () => {
      const me = await window.requireSession();
      if (!me) return;
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await window.api.post('/api/auth/logout');
        window.location.href = '/';
      });
      await loadClients();
      await loadScripts();
    })();
  </script>
</body>
</html>
