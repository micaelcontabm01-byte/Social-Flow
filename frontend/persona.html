<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persona - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .persona-name { font-size: 26px; font-weight: 700; }
    .persona-sub { color: var(--text-2); margin-top: 4px; margin-bottom: 16px; }
    .sect h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin: 18px 0 8px; }
    .sect ul { padding-left: 18px; }
    .sect li { padding: 3px 0; font-size: 14px; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { background: var(--bg-3); padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .arr-input { display: flex; gap: 6px; margin-bottom: 6px; }
    .arr-input input { flex: 1; }
    .badge-ia { background: var(--brand-soft); color: var(--brand-strong); font-size: 10px; padding: 3px 9px; border-radius: 12px; font-weight: 600; vertical-align: middle; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <a href="/dashboard" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/><rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/></svg><span>Dashboard</span></a>
      <a href="/clientes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.3" cy="6" r="2.6"/><path d="M1.3 15c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><circle cx="13" cy="6.5" r="2"/><path d="M11.6 10.6c1.9.4 3.4 1.8 3.4 4.1"/></svg><span>Clientes</span></a>
      <a href="/personas" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Personas</span></a>
      <a href="/roteiros" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h5l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M10 2v4h4"/><path d="M6.5 10.3h5M6.5 12.8h5"/></svg><span>Roteiros</span></a>
      <a href="/carrosseis" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="10" height="10" rx="1.3"/><path d="M5.5 5V3.3A1.3 1.3 0 0 1 6.8 2h7.9A1.3 1.3 0 0 1 16 3.3v7.9a1.3 1.3 0 0 1-1.3 1.3H13"/></svg><span>Carrosseis</span></a>
      <a href="/calendario" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12.5" rx="1.5"/><path d="M2 7h14M6 2v3M12 2v3"/></svg><span>Calendario</span></a>
      <a href="/edicao" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.5 15.5 6.7 6.2 16H2v-4.2L11.3 2.5Z"/></svg><span>Edição</span></a>
      <a href="/materiais" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.3A1.3 1.3 0 0 1 3.3 4h3.6l1.6 2H14.7A1.3 1.3 0 0 1 16 7.3v6.4A1.3 1.3 0 0 1 14.7 15H3.3A1.3 1.3 0 0 1 2 13.7V5.3Z"/></svg><span>Materiais</span></a>
      <div style="flex:1"></div>
      <a href="/billing" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 7.5h14"/><path d="M5 11.5h3"/></svg><span>Planos e cobranca</span></a>
      <a href="/configuracoes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg><span>Configuracoes</span></a>
      <button class="nav-item" id="logout-btn" style="text-align:left;"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16H3.5A1.5 1.5 0 0 1 2 14.5v-11A1.5 1.5 0 0 1 3.5 2H7"/><path d="M12 12.5 16 9l-4-3.5"/><path d="M16 9H6.5"/></svg><span>Sair</span></button>
    </aside>

    <main class="main">
      <a id="back-link" href="/clientes" class="muted small" style="display:inline-block; margin-bottom:12px;">&larr; Voltar</a>
      <div class="page-head">
        <h1 id="persona-title">Carregando...</h1>
        <div style="display:flex; gap:8px;" id="actions"></div>
      </div>

      <div id="alert"></div>

      <div id="view-mode" class="card"></div>
      <div id="edit-mode" class="card" style="display:none;"></div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const personaId = params.get('id');
    if (!personaId) location.href = '/personas';

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let current = null;

    function renderView(p) {
      $('#view-mode').innerHTML = `
        <div class="persona-name">${escapeHtml(p.name)}${p.generated_by_ai ? '<span class="badge-ia">IA</span>' : ''}</div>
        <div class="persona-sub">${escapeHtml(p.profession || '-')} &middot; ${escapeHtml(p.age_range || '-')} &middot; ${escapeHtml(p.gender || '-')} &middot; ${escapeHtml(p.location || '-')} &middot; Renda ${escapeHtml(p.income_range || '-')}</div>

        <div class="sect"><h3>Dores</h3>
          <ul>${(p.pain_points || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li class="muted">-</li>'}</ul>
        </div>
        <div class="sect"><h3>Desejos</h3>
          <ul>${(p.desires || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li class="muted">-</li>'}</ul>
        </div>
        <div class="sect"><h3>Objecoes</h3>
          <ul>${(p.objections || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li class="muted">-</li>'}</ul>
        </div>
        <div class="sect"><h3>Tom de voz</h3>
          <p style="font-size:14px;">${escapeHtml(p.language_tone || '-')}</p>
        </div>
        <div class="sect"><h3>Canais</h3>
          <div class="pill-list">${(p.channels || []).map(c => `<span class="pill">${escapeHtml(c)}</span>`).join('') || '<span class="muted small">-</span>'}</div>
        </div>
      `;
    }

    function arrayInputs(name, arr) {
      const items = (arr || []).map((v, i) => `
        <div class="arr-input">
          <input name="${name}" value="${escapeHtml(v)}" />
          <button type="button" class="btn btn-ghost" onclick="this.parentElement.remove()">x</button>
        </div>`).join('');
      return `<div id="arr-${name}">${items}</div>
        <button type="button" class="btn btn-ghost small" onclick="addArrayInput('${name}')">+ adicionar</button>`;
    }

    window.addArrayInput = function (name) {
      const div = document.createElement('div');
      div.className = 'arr-input';
      div.innerHTML = `<input name="${name}" /><button type="button" class="btn btn-ghost" onclick="this.parentElement.remove()">x</button>`;
      document.getElementById('arr-' + name).appendChild(div);
    };

    function renderEdit(p) {
      $('#edit-mode').innerHTML = `
        <form id="edit-form">
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
            <div class="field"><label>Nome</label><input name="name" value="${escapeHtml(p.name)}" required /></div>
            <div class="field"><label>Faixa etaria</label><input name="age_range" value="${escapeHtml(p.age_range || '')}" /></div>
            <div class="field"><label>Genero</label><input name="gender" value="${escapeHtml(p.gender || '')}" /></div>
            <div class="field"><label>Localizacao</label><input name="location" value="${escapeHtml(p.location || '')}" /></div>
            <div class="field"><label>Profissao</label><input name="profession" value="${escapeHtml(p.profession || '')}" /></div>
            <div class="field"><label>Renda</label><input name="income_range" value="${escapeHtml(p.income_range || '')}" /></div>
          </div>
          <div class="field"><label>Tom de voz</label><textarea name="language_tone" rows="2">${escapeHtml(p.language_tone || '')}</textarea></div>
          <div class="field"><label>Dores</label>${arrayInputs('pain_points', p.pain_points)}</div>
          <div class="field"><label>Desejos</label>${arrayInputs('desires', p.desires)}</div>
          <div class="field"><label>Objecoes</label>${arrayInputs('objections', p.objections)}</div>
          <div class="field"><label>Canais</label>${arrayInputs('channels', p.channels)}</div>
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" class="btn btn-ghost" id="cancel-edit">Cancelar</button>
            <button type="submit" class="btn">Salvar alteracoes</button>
          </div>
        </form>
      `;
      $('#cancel-edit').addEventListener('click', () => setMode('view'));
      $('#edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          name: fd.get('name'),
          age_range: fd.get('age_range'),
          gender: fd.get('gender'),
          location: fd.get('location'),
          profession: fd.get('profession'),
          income_range: fd.get('income_range'),
          language_tone: fd.get('language_tone'),
          pain_points: fd.getAll('pain_points').filter(Boolean),
          desires: fd.getAll('desires').filter(Boolean),
          objections: fd.getAll('objections').filter(Boolean),
          channels: fd.getAll('channels').filter(Boolean),
        };
        try {
          const r = await window.api.put('/api/personas/' + personaId, data);
          current = r.persona;
          renderView(current);
          setMode('view');
        } catch (err) {
          alert('Erro: ' + err.message);
        }
      });
    }

    function setMode(mode) {
      if (mode === 'edit') {
        renderEdit(current);
        $('#view-mode').style.display = 'none';
        $('#edit-mode').style.display = 'block';
        $('#actions').innerHTML = '';
      } else {
        $('#view-mode').style.display = 'block';
        $('#edit-mode').style.display = 'none';
        $('#actions').innerHTML = `
          <button class="btn btn-ghost" id="edit-btn">Editar</button>
          <button class="btn btn-ghost" id="delete-btn" style="color:var(--danger);">Excluir</button>
        `;
        $('#edit-btn').addEventListener('click', () => setMode('edit'));
        $('#delete-btn').addEventListener('click', async () => {
          if (!confirm('Excluir essa persona definitivamente?')) return;
          await window.api.del('/api/personas/' + personaId);
          location.href = '/cliente?id=' + current.client_id;
        });
      }
    }

    (async () => {
      const me = await window.requireSession();
      if (!me) return;
      $('#logout-btn').addEventListener('click', async () => {
        await window.api.post('/api/auth/logout');
        window.location.href = '/';
      });
      try {
        const { persona } = await window.api.get('/api/personas/' + personaId);
        current = persona;
        document.title = `${persona.name} - SocialFlow`;
        $('#persona-title').innerHTML = `${escapeHtml(persona.name)} <small style="font-size:14px; color: var(--text-2); font-weight: 400;">/ ${escapeHtml(persona.client_name)}</small>`;
        $('#back-link').href = '/cliente?id=' + persona.client_id;
        renderView(persona);
        setMode('view');
      } catch (err) {
        if (err.status === 404) {
          alert('Persona nao encontrada');
          location.href = '/personas';
        }
      }
    })();
  </script>
</body>
</html>
