<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .clients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .client-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
    .client-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .client-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .client-niche { color: var(--text-2); font-size: 13px; margin-bottom: 12px; }
    .client-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-3); }
    .empty { padding: 60px 24px; text-align: center; color: var(--text-2); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(40, 30, 20, 0.5); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--bg-1); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <a href="/dashboard" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/><rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/></svg><span>Dashboard</span></a>
      <a href="/clientes" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.3" cy="6" r="2.6"/><path d="M1.3 15c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><circle cx="13" cy="6.5" r="2"/><path d="M11.6 10.6c1.9.4 3.4 1.8 3.4 4.1"/></svg><span>Clientes</span></a>
      <a href="/personas" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Personas</span></a>
      <a href="/roteiros" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h5l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M10 2v4h4"/><path d="M6.5 10.3h5M6.5 12.8h5"/></svg><span>Roteiros</span></a>
      <a href="/carrosseis" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="10" height="10" rx="1.3"/><path d="M5.5 5V3.3A1.3 1.3 0 0 1 6.8 2h7.9A1.3 1.3 0 0 1 16 3.3v7.9a1.3 1.3 0 0 1-1.3 1.3H13"/></svg><span>Carrosseis</span></a>
      <a href="/calendario" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12.5" rx="1.5"/><path d="M2 7h14M6 2v3M12 2v3"/></svg><span>Calendario</span></a>
      <a href="/edicao" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.5 15.5 6.7 6.2 16H2v-4.2L11.3 2.5Z"/></svg><span>Edição</span></a>
      <a href="/materiais" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.3A1.3 1.3 0 0 1 3.3 4h3.6l1.6 2H14.7A1.3 1.3 0 0 1 16 7.3v6.4A1.3 1.3 0 0 1 14.7 15H3.3A1.3 1.3 0 0 1 2 13.7V5.3Z"/></svg><span>Materiais</span></a>
      <div style="flex:1"></div>
      <a href="/billing" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 7.5h14"/><path d="M5 11.5h3"/></svg><span>Planos e cobranca</span></a>
      <a href="/configuracoes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg><span>Configuracoes</span></a>
      <button class="nav-item" id="logout-btn" style="text-align:left;"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16H3.5A1.5 1.5 0 0 1 2 14.5v-11A1.5 1.5 0 0 1 3.5 2H7"/><path d="M12 12.5 16 9l-4-3.5"/><path d="M16 9H6.5"/></svg><span>Sair</span></button>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1>Clientes</h1>
        <button class="btn" id="new-btn">+ Novo cliente</button>
      </div>

      <div id="alert"></div>
      <div id="list"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2>Novo cliente</h2>
      <form id="form">
        <div id="form-alert"></div>
        <div class="field">
          <label for="name">Nome do cliente *</label>
          <input id="name" name="name" required maxlength="120" />
        </div>
        <div class="field">
          <label for="niche">Nicho / segmento</label>
          <input id="niche" name="niche" placeholder="Ex: Restaurante, Pet Shop, Clinica" maxlength="200" />
        </div>
        <div class="field">
          <label for="instagram_handle">@ do Instagram</label>
          <input id="instagram_handle" name="instagram_handle" placeholder="sem o @" maxlength="50" />
          <p class="muted small" style="margin-top:6px;">A pasta no Google Drive e criada depois, dentro do cliente (aba Materiais), com 1 clique.</p>
        </div>
        <div class="field">
          <label for="notes">Observacoes</label>
          <textarea id="notes" name="notes" rows="3" maxlength="2000"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancelar</button>
          <button type="submit" class="btn" id="save-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const modal = $('#modal');
    const form = $('#form');

    function openModal() { modal.classList.add('open'); $('#name').focus(); }
    function closeModal() { modal.classList.remove('open'); form.reset(); $('#form-alert').innerHTML = ''; }

    async function loadList() {
      try {
        const { clients } = await window.api.get('/api/clients');
        if (clients.length === 0) {
          $('#list').innerHTML = `
            <div class="empty">
              <p style="font-size:18px; margin-bottom:8px;">Nenhum cliente ainda</p>
              <p class="small">Cadastre o primeiro cliente para comecar a gerar persona, roteiros e carrosseis.</p>
            </div>`;
          return;
        }
        $('#list').innerHTML = `<div class="clients-grid">${clients.map(c => `
          <a class="client-card" href="/cliente?id=${c.id}">
            <div class="client-name">${escapeHtml(c.name)}</div>
            <div class="client-niche">${escapeHtml(c.niche || 'Sem nicho definido')}</div>
            <div class="client-stats">
              <span>${c.personas_count} persona${c.personas_count == 1 ? '' : 's'}</span>
              ${c.instagram_handle ? `<span>@${escapeHtml(c.instagram_handle)}</span>` : ''}
            </div>
          </a>
        `).join('')}</div>`;
      } catch (err) {
        $('#list').innerHTML = `<div class="alert alert-error">Erro ao carregar: ${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#save-btn').disabled = true;
      $('#form-alert').innerHTML = '';
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      try {
        await window.api.post('/api/clients', data);
        closeModal();
        await loadList();
      } catch (err) {
        if (err.status === 402) {
          $('#form-alert').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}. <a href="/billing">Faca upgrade do plano</a>.</div>`;
        } else {
          $('#form-alert').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        }
      } finally {
        $('#save-btn').disabled = false;
      }
    });

    $('#new-btn').addEventListener('click', openModal);
    $('#cancel-btn').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    (async () => {
      const me = await window.requireSession();
      if (!me) return;
      $('#logout-btn').addEventListener('click', async () => {
        await window.api.post('/api/auth/logout');
        window.location.href = '/';
      });
      await loadList();
    })();
  </script>
</body>
</html>
