<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatorios - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .report-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--bg-2); border-radius: var(--radius-sm);
      margin-bottom: 8px; gap: 12px;
    }
    .report-row .info { flex: 1; min-width: 0; }
    .report-row .name { font-weight: 600; font-size: 14px; }
    .report-row .meta { color: var(--text-2); font-size: 12px; }
    .period-pill {
      background: var(--brand-soft); color: var(--brand-strong);
      padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
      text-transform: capitalize;
    }
    .gen-tag {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: var(--bg-3); color: var(--text-3); margin-left: 6px;
    }
    .upgrade-state {
      background: linear-gradient(135deg, #1a1a1a, #3d2c1d);
      color: #fff;
      padding: 32px 28px; border-radius: 14px; text-align: center;
    }
    .upgrade-state h2 { color: #fff; margin-bottom: 8px; }
    .month-group { margin-bottom: 22px; }
    .month-group h3 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-3); margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <a href="/dashboard" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/><rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/></svg><span>Dashboard</span></a>
      <a href="/clientes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.3" cy="6" r="2.6"/><path d="M1.3 15c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><circle cx="13" cy="6.5" r="2"/><path d="M11.6 10.6c1.9.4 3.4 1.8 3.4 4.1"/></svg><span>Clientes</span></a>
      <a href="/personas" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Personas</span></a>
      <a href="/roteiros" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h5l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M10 2v4h4"/><path d="M6.5 10.3h5M6.5 12.8h5"/></svg><span>Roteiros</span></a>
      <a href="/carrosseis" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="10" height="10" rx="1.3"/><path d="M5.5 5V3.3A1.3 1.3 0 0 1 6.8 2h7.9A1.3 1.3 0 0 1 16 3.3v7.9a1.3 1.3 0 0 1-1.3 1.3H13"/></svg><span>Carrosseis</span></a>
      <a href="/calendario" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.5" width="14" height="12.5" rx="1.5"/><path d="M2 7h14M6 2v3M12 2v3"/></svg><span>Calendario</span></a>
      <a href="/edicao" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.3 2.5 15.5 6.7 6.2 16H2v-4.2L11.3 2.5Z"/></svg><span>Edição</span></a>
      <a href="/materiais" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.3A1.3 1.3 0 0 1 3.3 4h3.6l1.6 2H14.7A1.3 1.3 0 0 1 16 7.3v6.4A1.3 1.3 0 0 1 14.7 15H3.3A1.3 1.3 0 0 1 2 13.7V5.3Z"/></svg><span>Materiais</span></a>
      <a href="/relatorios" class="nav-item active">Relatorios</a>
      <div style="flex:1"></div>
      <a href="/billing" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 7.5h14"/><path d="M5 11.5h3"/></svg><span>Planos e cobranca</span></a>
      <a href="/configuracoes" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg><span>Configuracoes</span></a>
      <button class="nav-item" id="logout-btn" style="text-align:left;"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16H3.5A1.5 1.5 0 0 1 2 14.5v-11A1.5 1.5 0 0 1 3.5 2H7"/><path d="M12 12.5 16 9l-4-3.5"/><path d="M16 9H6.5"/></svg><span>Sair</span></button>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1>Relatorios mensais</h1>
          <p class="muted small" style="margin-top:4px;">PDF por cliente com producao, taxa de aprovacao e funil. Gerados automaticamente todo dia 1.</p>
        </div>
        <div id="gen-controls" style="display:none; gap: 8px;">
          <select id="gen-client" style="padding:8px 12px; border:1px solid var(--border); border-radius: 8px;"></select>
          <button class="btn" id="gen-btn">Gerar agora</button>
        </div>
      </div>

      <div id="content">Carregando...</div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const MONTH_NAMES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderUpgrade() {
      document.getElementById('content').innerHTML = `
        <div class="upgrade-state">
          <div style="font-size: 11px; letter-spacing: 0.1em; color: #d9c9b0; font-weight: 700; margin-bottom: 4px;">EXCLUSIVO BLACK</div>
          <h2>Relatorios mensais por cliente</h2>
          <p style="opacity:0.9; margin-bottom: 20px; max-width: 480px; margin-left:auto; margin-right:auto;">
            Todo dia 1 a gente gera automaticamente um PDF de cada cliente com producao, taxa de aprovacao, funil de conteudo e resumo executivo. Voce manda direto pro seu cliente.
          </p>
          <a href="/billing" class="btn" style="background:#fff; color:#3d2c1d; border:none;">Fazer upgrade pra BLACK</a>
        </div>
      `;
    }

    function renderReports(reports) {
      if (reports.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="card" style="text-align:center; padding: 40px 24px;">
            <h3 style="margin-bottom:8px;">Ainda sem relatorios</h3>
            <p class="muted">A geracao automatica acontece no dia 1 de cada mes. Voce tambem pode gerar agora pelo botao acima (precisa de um mes ja iniciado).</p>
          </div>
        `;
        return;
      }
      // Agrupa por periodo
      const groups = {};
      for (const r of reports) {
        const key = r.period_year + '-' + String(r.period_month).padStart(2, '0');
        if (!groups[key]) groups[key] = { year: r.period_year, month: r.period_month, items: [] };
        groups[key].items.push(r);
      }
      const keys = Object.keys(groups).sort().reverse();
      document.getElementById('content').innerHTML = keys.map(k => {
        const g = groups[k];
        return `
          <div class="month-group">
            <h3>${MONTH_NAMES[g.month - 1]} ${g.year}</h3>
            ${g.items.map(r => `
              <div class="report-row">
                <div class="info">
                  <div class="name">${escapeHtml(r.client_name)} ${r.instagram_handle ? '<span class="muted small">@' + escapeHtml(r.instagram_handle) + '</span>' : ''}</div>
                  <div class="meta">
                    Gerado em ${new Date(r.generated_at).toLocaleString('pt-BR')}
                    <span class="gen-tag">${r.generated_by === 'cron' ? 'automatico' : 'manual'}</span>
                  </div>
                </div>
                <a href="/api/reports/${r.id}/download" class="btn btn-ghost" download>Baixar PDF</a>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    async function loadReports() {
      try {
        const { reports } = await window.api.get('/api/reports');
        renderReports(reports);
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="alert alert-error">Erro carregando: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadClientsSelect() {
      const { clients } = await window.api.get('/api/clients');
      const sel = document.getElementById('gen-client');
      if (clients.length === 0) {
        sel.innerHTML = '<option value="">(nenhum cliente)</option>';
        document.getElementById('gen-btn').disabled = true;
        return;
      }
      sel.innerHTML = clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }

    document.getElementById('gen-btn').addEventListener('click', async () => {
      const clientId = document.getElementById('gen-client').value;
      if (!clientId) return;
      const btn = document.getElementById('gen-btn');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Gerando...';
      try {
        await window.api.post('/api/reports/generate', { client_id: clientId });
        await loadReports();
        btn.textContent = 'Pronto!';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
      } catch (err) {
        alert('Erro: ' + err.message);
        btn.textContent = original;
        btn.disabled = false;
      }
    });

    (async () => {
      const me = await window.requireSession();
      if (!me) return;

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await window.api.post('/api/auth/logout');
        window.location.href = '/';
      });

      // Cliente externo nao tem acesso a relatorios
      if (me.role === 'client') {
        window.location.href = '/dashboard';
        return;
      }

      if (me.plan_code !== 'black') {
        renderUpgrade();
        return;
      }

      // BLACK ativo
      document.getElementById('gen-controls').style.display = 'flex';
      await Promise.all([loadReports(), loadClientsSelect()]);
    })();
  </script>
</body>
</html>
