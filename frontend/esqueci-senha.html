<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci minha senha - SocialFlow</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="form">
      <div class="brand-mark"><img src="/assets/img/logo.svg" alt="" />SocialFlow</div>
      <h1>Esqueci minha senha</h1>
      <p class="subtitle">Digite seu email e mandamos um link pra criar uma senha nova.</p>

      <div id="alert"></div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>

      <button type="submit" class="btn btn-block" id="submit-btn">Enviar link</button>

      <p class="small muted" style="margin-top:16px; text-align:center;">
        <a href="/login">Voltar pro login</a>
      </p>
    </form>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try {
        await window.api.post('/api/auth/forgot-password', {
          email: document.getElementById('email').value,
        });
        form.innerHTML = `
          <div class="alert alert-success">
            Se esse email estiver cadastrado, mandamos um link de redefinicao. Confira sua caixa de entrada (e o spam).
          </div>
          <p class="small muted" style="margin-top:16px; text-align:center;">
            <a href="/login">Voltar pro login</a>
          </p>`;
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message || 'Falha ao enviar'}</div>`;
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    });
  </script>
</body>
</html>
